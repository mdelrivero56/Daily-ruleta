<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de Sistemas</title>
<meta name="description" content="Catálogo institucional de sistemas digitales. Explora, conoce y solicita los sistemas disponibles para tu dependencia.">
<style>
/* Diseño: barra lateral en escritorio y panel inferior anclado en teléfono.
   Contenido en estantes (carruseles, listas de filas con icono, fichas largas). Acento azul, iconos "squircle" con degradado. */
:root{
  --bg:#ffffff; --bg-soft:#f4f6f9; --bg-card:#f4f6f9; --bg-input:#ffffff;
  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#8e8e93;
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.3);
  --accent:#0a64c8; --accent-ink:#ffffff; --accent-soft:rgba(10,100,200,.11);
  --pill:#eef1f6; --pill-ink:#0a64c8;
  --ok:#1f8a3b; --ok-soft:rgba(31,138,59,.12); --warn:#b25000; --warn-soft:rgba(255,149,0,.16); --bad:#d70015; --bad-soft:rgba(215,0,21,.1);
  --glass:rgba(255,255,255,.76); --sidebar:#f4f4f7; --sel:rgba(60,60,67,.1);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.09);
  --shadow-pop:0 20px 60px rgba(0,0,0,.28);
  --scrim:rgba(0,0,0,.4);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:40px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-soft:#1c1c1e; --bg-card:#1c1c1e; --bg-input:#2c2c2e;
    --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93;
    --sep:rgba(84,84,88,.5); --sep-strong:rgba(120,120,128,.6);
    --accent:#4a9bf0; --accent-ink:#ffffff; --accent-soft:rgba(74,155,240,.18);
    --pill:#2c2c2e; --pill-ink:#4a9bf0;
    --ok:#32d74b; --ok-soft:rgba(50,215,75,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.16);
    --glass:rgba(28,28,30,.76); --sidebar:#161618; --sel:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-soft:#1c1c1e; --bg-card:#1c1c1e; --bg-input:#2c2c2e;
  --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93;
  --sep:rgba(84,84,88,.5); --sep-strong:rgba(120,120,128,.6);
  --accent:#4a9bf0; --accent-ink:#ffffff; --accent-soft:rgba(74,155,240,.18);
  --pill:#2c2c2e; --pill-ink:#4a9bf0;
  --ok:#32d74b; --ok-soft:rgba(50,215,75,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.16);
  --glass:rgba(28,28,30,.76); --sidebar:#161618; --sel:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
@media (max-width:900px){:root{--gutter:16px}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.g{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar);border-right:1px solid var(--sep);padding:20px 14px 16px;display:flex;flex-direction:column;gap:16px}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:0 var(--gutter) 72px;outline:none}
.foot{max-width:1100px;width:100%;margin:0 auto;padding:28px var(--gutter) 40px;color:var(--label-2);font-size:12.5px;border-top:1px solid var(--sep);display:flex;gap:6px 24px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;color:var(--label);padding:2px 6px;border-radius:12px}
.brand:hover{text-decoration:none}
.brand .ico{--s:38px}
.brand b{display:block;font-size:15px;line-height:1.2;letter-spacing:-.015em}
.brand small{display:block;color:var(--label-2);font-size:12px;line-height:1.25;margin-top:2px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--sel);border-radius:10px;padding:0 10px;color:var(--label-2)}
.searchbox input[type=search]{flex:1;border:0;background:none;box-shadow:none;border-radius:0;min-width:0;border:0;background:none;outline:0;padding:8px 0;font-size:15px}
.searchbox input::placeholder{color:var(--label-3)}
.searchbox:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav h6{margin:14px 10px 4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--label-3)}
.sidenav a,.sidenav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--label);font-size:15px;width:100%;text-align:left}
.sidenav a:hover,.sidenav button:hover{background:var(--sel);text-decoration:none}
.sidenav [aria-current="page"]{background:var(--sel);font-weight:600}
.sidenav .g{color:var(--accent)}
.sidenav .cdot{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));flex:none}
.sidenav .cdot .g{width:12px;height:12px;color:#fff;stroke-width:2.2}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--sep)}
.side-foot .mode{font-size:12.5px;color:var(--label-2);padding:0 10px}

.tabbar{display:none;position:fixed;top:0;bottom:0;left:0;width:68px;z-index:40;flex-direction:column;align-items:stretch;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) 6px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-right:1px solid var(--sep);border-radius:0 24px 24px 0;box-shadow:8px 0 30px rgba(0,0,0,.06);overflow-y:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar::after{content:"";position:absolute;top:18px;bottom:18px;right:-1px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--accent),transparent 70%);opacity:.55;pointer-events:none}
.rail-brand{width:42px;height:42px;margin:0 auto 12px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#2bb5a0);color:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18);flex:none}
.rail-brand:hover{text-decoration:none}
.rail-brand img{width:100%;height:100%;object-fit:cover}
.rail-brand .g{width:22px;height:22px}
.tabbar a:not(.rail-brand),.rail-admin{position:relative;flex:none;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:14px;color:var(--label-2);font-size:9.5px;font-weight:600;letter-spacing:-.01em;transition:background .15s,color .15s}
.tabbar a:hover{text-decoration:none}
.tabbar a:not(.rail-brand) span,.rail-admin span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar .g{width:23px;height:23px;stroke-width:1.9}
.rail-admin{margin-top:auto}
.tabbar a:not(.rail-brand)::before{content:"";position:absolute;left:-6px;top:24%;bottom:24%;width:4px;border-radius:0 4px 4px 0;background:var(--accent);transform:scaleY(0);transition:transform .2s}
.tabbar a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tabbar a[aria-current="page"]::before{transform:scaleY(1)}
.rail-admin.on{color:var(--ok)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-left:68px}
  .sidebar{display:none}
  .tabbar{display:flex}
  main{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  .toast{left:calc(50% + 34px);max-width:calc(100vw - 68px - 24px)}
}

/* ---------- Encabezados ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:calc(34px + env(safe-area-inset-top,0px));padding-bottom:6px}
.pagehead .when{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em}
.large-title{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.pagehead .large-title{margin-top:2px}
.pagehead .large-title::before{content:"";display:block;width:36px;height:4px;border-radius:4px;margin-bottom:10px;background:linear-gradient(90deg,var(--accent),#2bb5a0)}
.lede{color:var(--label-2);font-size:17px;max-width:62ch;margin-top:6px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#8a8dff,#4338d8);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;box-shadow:0 2px 8px rgba(67,56,216,.35)}
.avatar.on{background:linear-gradient(145deg,#62dc8c,#12994a);box-shadow:0 2px 8px rgba(18,153,74,.35)}
.avatar .g{width:20px;height:20px}
@media (min-width:901px){.avatar{display:none}.pagehead{padding-top:44px}}

.navbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;margin-inline:calc(-1*var(--gutter));padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;background:transparent;border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom-color:var(--sep)}
.navbar .mid{flex:1;display:flex;justify-content:center;min-width:0;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
.navbar.show .mid{opacity:1;transform:none;pointer-events:auto}
.navbar .mid .ico{--s:34px}
.navbar .mid .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.navbar .spacer{flex:1}
.navbar .right{display:flex;gap:8px;align-items:center}
.circ{width:40px;height:40px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--sep),0 2px 8px rgba(0,0,0,.06);display:grid;place-items:center;color:var(--accent);flex:none}
.circ:hover{text-decoration:none;background:var(--bg-soft)}
.circ .g{width:21px;height:21px}
.navbar .get{opacity:0;pointer-events:none;transition:opacity .2s}
.navbar.show .get{opacity:1;pointer-events:auto}

/* ---------- Iconos de sistema ---------- */
.ico{--s:64px;width:var(--s);height:var(--s);border-radius:27%;background:linear-gradient(150deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.12)}
.ico::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.ico .g{width:52%;height:52%;stroke-width:1.7;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.ico img{width:100%;height:100%;object-fit:cover}
.ico.s28{--s:28px}.ico.s34{--s:34px}.ico.s40{--s:40px}.ico.s48{--s:48px}.ico.s64{--s:64px}.ico.s96{--s:96px}.ico.s128{--s:128px}
.ico.s128{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 6px 22px rgba(0,0,0,.18)}

/* ---------- Botones ---------- */
.get{display:inline-flex;align-items:center;justify-content:center;background:var(--pill);color:var(--pill-ink);font-weight:700;font-size:15px;line-height:1;padding:8px 18px;border-radius:12px;min-width:78px;white-space:nowrap;transition:filter .15s,transform .1s}
.get:hover{filter:brightness(.96)}
.get:active{transform:scale(.97)}
.get:disabled{opacity:.45;filter:none;transform:none}
.get.big{background:var(--accent);color:var(--accent-ink);padding:11px 26px;font-size:16px;min-width:0}
.get.big:hover{filter:brightness(1.08)}
.get.glass{background:rgba(120,120,128,.55);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:9px 22px}
.get.sm{padding:7px 16px;font-size:14px}
.get-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.get-note{font-size:11px;color:var(--label-2);text-align:center;line-height:1.15;max-width:96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:600;font-size:15px;line-height:1.2;background:var(--accent);color:var(--accent-ink);transition:filter .15s}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn.sec{background:var(--pill);color:var(--accent)}
.btn.sec:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:10px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;filter:none}
.btn .g{width:18px;height:18px}
.btn2{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--sep-strong);color:var(--accent);font-weight:600;font-size:15px}
.btn2:hover{background:var(--accent-soft);text-decoration:none}
.btn2 .g{width:17px;height:17px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--label-2)}
.iconbtn:hover{background:var(--sel);color:var(--label)}
.iconbtn.bad:hover{color:var(--bad);background:var(--bad-soft)}
.iconbtn:disabled{opacity:.3}
.iconbtn .g{width:19px;height:19px}

/* ---------- Estantes ---------- */
.bleed{margin-inline:calc(-1*var(--gutter));padding-inline:var(--gutter);scroll-padding-inline:var(--gutter)}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-block:14px 6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:10px;flex:none;background:var(--bg-soft);border-radius:999px;padding:8px 20px 8px 10px;font-weight:600;font-size:17px;color:var(--label);white-space:nowrap}
.chip:hover{text-decoration:none;filter:brightness(.97)}
.chip .cdot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff}
.chip .cdot .g{width:17px;height:17px;stroke-width:2}
.chip[aria-pressed="true"],.chip.on{background:var(--label);color:var(--bg)}
.chip.txt{padding:8px 18px;font-size:15px}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em;padding-bottom:12px;text-wrap:balance}
.sec-h a,.sec-h button{color:var(--label);display:inline;font:inherit}
.sec-h a:hover{text-decoration:none}
.sec-h .g{color:var(--label-3);width:20px;height:20px;vertical-align:-3px;display:inline-block}
.sec-h .more-l{font-size:15px;font-weight:500;color:var(--accent)}
.hscroll{display:grid;grid-auto-flow:column;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:4px 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}

.feat-row{grid-auto-columns:min(86%,560px)}
.feat{min-width:0}
.feat-txt{display:flex;flex-direction:column;gap:1px;color:var(--label);padding:18px 2px 12px}
.feat-txt:hover{text-decoration:none}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.02em}
.feat-txt strong{font-size:23px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.feat-txt .sub{font-size:21px;line-height:1.25;color:var(--label-2);letter-spacing:-.02em}
.feat-card{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/11;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:var(--shadow);isolation:isolate}
.feat-art{position:absolute;inset:0;display:block;overflow:hidden}
.feat-art:hover{text-decoration:none}
.feat-art::before{content:"";position:absolute;width:90%;aspect-ratio:1;border-radius:50%;right:-25%;top:-35%;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 68%)}
.feat-art::after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;left:-22%;bottom:-40%;background:radial-gradient(circle,rgba(0,0,0,.22),transparent 70%)}
.feat-art>img{width:100%;height:100%;object-fit:cover}
.feat-glyph{position:absolute;left:8%;top:12%;width:42%;color:rgba(255,255,255,.92);filter:drop-shadow(0 8px 18px rgba(0,0,0,.22));z-index:1}
.feat-glyph .g{width:100%;height:auto;aspect-ratio:1;stroke-width:1.1}
.feat-shot{position:absolute;right:-6%;top:15%;width:56%;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);transform:rotate(-3deg);z-index:1;background:#fff}
.feat-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:46px 16px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.62));color:#fff;z-index:2}
.feat-bar .t{flex:1;min-width:0}
.feat-bar b{display:block;font-weight:600;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-bar small{display:block;color:rgba(255,255,255,.82);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-bar .get-note{color:rgba(255,255,255,.8)}
.feat-bar .ico{--s:48px}

.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));column-gap:36px}
.row{display:flex;align-items:center;gap:14px;padding:10px 0;position:relative;min-width:0}
.row::after{content:"";position:absolute;left:78px;right:0;bottom:0;height:1px;background:var(--sep)}
.row-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:var(--label)}
.row-main:hover{text-decoration:none}
.row-t{min-width:0;flex:1}
.row-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.015em}
.row-t small{display:block;color:var(--label-2);font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:1px}
.row-t .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
@media (max-width:900px){
  .rows.paged{grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(3,auto);grid-auto-columns:88%;column-gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1*var(--gutter));padding-inline:var(--gutter);scroll-padding-inline:var(--gutter);scrollbar-width:none}
  .rows.paged::-webkit-scrollbar{display:none}
  .rows.paged .row{scroll-snap-align:start}
  .rows.paged .row:nth-child(3n)::after{display:none}
  .rows.paged .row-t small{-webkit-line-clamp:1}
}

.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}

.hist li{padding:12px 0;border-bottom:1px solid var(--sep)}

.hist .h{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px}
.hist b{font-size:16px}.hist .h span{color:var(--label-2);font-size:14px}
.lightbox{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.92);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:fade .15s ease}
.lightbox header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#fff;font-size:15px}
.lightbox .stage{display:grid;place-items:center;padding:0 60px;min-height:0;position:relative}
.lightbox img{max-height:100%;max-width:100%;object-fit:contain;border-radius:10px}
.lightbox footer{padding:14px 18px 18px;color:#d0d0d5;text-align:center;font-size:14.5px;min-height:52px}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lightbox .nav:hover{background:rgba(255,255,255,.26)}
.lightbox .nav.l{left:8px}.lightbox .nav.r{right:8px}
.lightbox .iconbtn{color:#fff}.lightbox .iconbtn:hover{background:rgba(255,255,255,.18);color:#fff}
@media (max-width:640px){.lightbox .stage{padding:0 8px}.lightbox .nav{display:none}}
/* ---------- Gestión rápida, configuración y panel de imágenes ---------- */
.manage{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1.5px dashed var(--sep-strong);color:var(--label-2);font-size:13.5px;font-weight:600;transition:color .15s,border-color .15s,background .15s}
.mbtn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.mbtn .g{width:17px;height:17px}
.imgmod .cur{display:flex;gap:16px;align-items:center}
.imgmod .cur+.cur{margin-top:18px;padding-top:18px;border-top:1px solid var(--sep)}
.imgmod .up{display:flex;gap:8px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
.imgmod small{display:block;color:var(--label-2);font-size:13.5px;margin:2px 0 10px}
.imgmod .port{width:120px;aspect-ratio:16/11;border-radius:12px;object-fit:cover;background:var(--bg-soft);flex:none;display:grid;place-items:center;color:var(--label-3)}
.cfg{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.cfg-nav{position:sticky;top:20px;display:grid;gap:2px}
.cfg-nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--label);font-size:15px;font-weight:500}
.cfg-nav a:hover{background:var(--sel);text-decoration:none}
.cfg-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cfg-nav .g{width:20px;height:20px}
.cfg-body{min-width:0}
@media (max-width:900px){.cfg{grid-template-columns:minmax(0,1fr);gap:14px}.cfg-nav{position:static;display:flex;overflow-x:auto;gap:6px}.cfg-nav a{white-space:nowrap;flex:none;background:var(--sel)}}
.chk-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep)}
.chk-item:last-child{border-bottom:0}
.chk-item .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk-item .dot .g{width:16px;height:16px;stroke-width:2.4}
.dot.ok{background:var(--ok-soft);color:var(--ok)}.dot.warn{background:var(--warn-soft);color:var(--warn)}.dot.off{background:var(--sel);color:var(--label-3)}
.chk-item .t{flex:1;min-width:0}.chk-item .t b{display:block;font-size:15px}.chk-item .t small{color:var(--label-2);font-size:13.5px}
.opt-row{display:flex;gap:8px;flex-wrap:wrap}
.opt-row button{padding:9px 16px;border-radius:10px;border:1.5px solid var(--sep-strong);font-weight:600;font-size:14.5px}
.opt-row button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cfg-note{color:var(--label-2);font-size:13.5px;margin-top:6px}

/* ---------- Acceso (RFC + contraseña) ---------- */
body.auth .sidebar,body.auth .tabbar,body.auth .foot{display:none!important}
body.auth .app{grid-template-columns:minmax(0,1fr);padding-left:0}
body.auth main{max-width:none;padding:0}
.authwrap{min-height:100vh;display:grid;align-content:center;justify-items:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(900px 500px at 12% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 420px at 100% 110%,rgba(43,181,160,.14),transparent 60%)}
.authcard{width:min(440px,100%);background:var(--bg);border:1px solid var(--sep);border-radius:24px;padding:30px 24px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.authcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),#2bb5a0)}
.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.auth-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(145deg,var(--accent),#2bb5a0);flex:none}
.auth-logo img{width:100%;height:100%;object-fit:cover}.auth-logo .g{width:24px;height:24px}
.auth-brand b{display:block;font-size:16px;letter-spacing:-.015em;line-height:1.2}.auth-brand small{color:var(--label-2);font-size:13px}
.authcard h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.authcard .lede{font-size:15px;margin:6px 0 18px}
.authcard form{display:grid;gap:14px}
.authcard .btn.big{padding:13px 18px;font-size:16px;width:100%}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:14.5px}
.auth-links button{color:var(--accent);font-weight:600}
.auth-foot{color:var(--label-3);font-size:12.5px;text-align:center;max-width:440px}
.pwrow{position:relative}.pwrow input{padding-right:84px}
.showpw{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:13px;font-weight:600;color:var(--accent);border-radius:8px}
.avatar-i{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--accent),#2bb5a0);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
button.avatar{font:inherit;font-weight:700}
.tmp{font-family:var(--mono);font-size:22px;letter-spacing:.06em;font-weight:700;background:var(--bg-soft);border-radius:12px;padding:14px;text-align:center;user-select:all;word-break:break-all}
.auth-steps{display:grid;gap:14px;margin:4px 0 18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--label);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:120;font-size:15px;font-weight:500;box-shadow:var(--shadow-pop);max-width:calc(100vw - 32px);text-align:center;animation:fade .15s ease}
@media (min-width:901px){.toast{bottom:32px}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--label-2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sep-strong);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--label-2)}
.sp{height:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.cwrap{display:grid;gap:8px;align-content:start}

.bar{height:8px;border-radius:99px;background:var(--sep);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.chkgrp{display:grid;gap:6px;margin:10px 0}
.chkgrp>b{font-size:14px}
.rolhelp{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--label-2)}
.rolhelp b{color:var(--label)}
.auth-alt{margin-top:10px}
.chk-item .dot.bad{background:var(--bad-soft);color:var(--bad)}

.qa-log details{border:1px solid var(--sep);border-radius:12px;padding:10px 12px;background:var(--bg-soft);font-size:14px}
.qa-log pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:12.5px}

const CONFIG_BASE = {

/* ---------- Persistencia (IndexedDB, con respaldo en memoria) ---------- */
const IDB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open("catalogo-sistemas", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false); r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(k) {
    return new Promise((res) => {
      if (!this.db) return res(undefined);
      try { const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); }
    });
  },
  set(k, v) {
    return new Promise((res) => {
      if (!this.db) return res(false);
      try { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  del(k) {
    return new Promise((res) => {
      if (!this.db) return res(false);
      try { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
};

function validarSolicitud() {
  const v = F.vals, e = {};
  const req = (k, m) => { if (!String(v[k] || "").trim()) e[k] = m; };
  if (!F.sel.length) e.sel = "Elige al menos un sistema.";
  req("dependencia", "Escribe el nombre de tu dependencia."); req("cargo", "Escribe tu cargo."); req("nombre", "Escribe tu nombre completo.");
  if (!correoOk(v.correo)) e.correo = "Escribe un correo válido, por ejemplo nombre@dependencia.gob.mx.";
  if (String(v.telefono || "").replace(/\D/g, "").length < 8) e.telefono = "Escribe un teléfono de al menos 8 dígitos.";
  req("tipoUso", "Elige el tipo de uso."); req("mensaje", "Cuéntanos brevemente qué necesitas.");
  if (!v.acepto) e.acepto = "Necesitamos tu aceptación para continuar.";
  return e;
}
const folioNuevo = () => { const d = hoyISO().replace(/-/g, ""); return `SOL-${d}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`; };

function armarMensaje(sol) {
  const d = sol.datos, L = [];
  L.push("SOLICITUD DE SISTEMA", "Folio: " + sol.folio, `Fecha: ${fmtFecha(sol.fecha)}, ${sol.hora}`, "", "SISTEMAS SOLICITADOS");
  sol.sistemas.forEach((s) => L.push("- " + s.nombre + (s.version ? ` (v${s.version})` : "")));
  L.push("", "DATOS DE LA DEPENDENCIA");
  [["Dependencia", d.dependencia], ["Área o unidad", d.area], ["Nombre", d.nombre], ["Cargo", d.cargo], ["Correo", d.correo], ["Teléfono", d.telefono], ["Contacto preferido", d.contactoPref], ["Horario preferido", d.horario]].forEach(([k, x]) => { if (x) L.push(`${k}: ${x}`); });
  L.push("", "USO PREVISTO");
  [["Tipo de uso", d.tipoUso], ["Fecha estimada", d.fechaUso ? fmtFecha(d.fechaUso) : ""], ["Personas que lo usarían", d.participantes]].forEach(([k, x]) => { if (x) L.push(`${k}: ${x}`); });
  L.push("", "NECESIDAD", d.mensaje);
  return L.join("\n");
}
const asuntoSol = (sol) => `Solicitud de sistema: ${sol.sistemas.map((s) => s.nombre).join(", ")} — ${sol.datos.dependencia} (${sol.folio})`;
const mailtoSol = (sol) => `mailto:${cfg().correoDestino}?subject=${enc(asuntoSol(sol))}&body=${enc(armarMensaje(sol))}`;

function enfocarError() {
  const el = $(".field.bad input,.field.bad select,.field.bad textarea") || $("#err-sel") || $("#err-acepto");
  if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); if (el.focus) el.focus({ preventScroll: true }); }
}

async function enviarSolicitud() {
  F.errs = validarSolicitud();
  if (Object.keys(F.errs).length) { keep(() => render(false)); enfocarError(); return; }
  if (F.vals.web) { go("solicitudes"); return; }
  if (F.enviando) return;
  F.enviando = true;
  const b = $("#btn-enviar"); if (b) { b.disabled = true; b.textContent = "Enviando…"; }
  const d = new Date(), v = F.vals, c = cfg();
  const sol = {
    id: uid("sol"), folio: folioNuevo(), fecha: hoyISO(), hora: `${pad(d.getHours())}:${pad(d.getMinutes())}`,

  if (urlOk(c.endpoint)) {

      const r = await fetch(urlOk(c.endpoint), { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(Object.assign({ folio: sol.folio, asunto: asuntoSol(sol), _subject: asuntoSol(sol), mensaje: armarMensaje(sol), email: sol.datos.correo, sistemas: sol.sistemas.map((s) => s.nombre).join(", ") }, sol.datos)) });

/* ---------- Lista de verificación de requisitos ---------- */
const baseReqs = () => String(cfg().requisitosBase || "").split("\n").map((x) => x.trim()).filter(Boolean);
const baseDe = (sol) => (Array.isArray(sol.base) ? sol.base : baseReqs());
const propiosDe = (si) => { if (Array.isArray(si.requisitos)) return si.requisitos; const s = byId(si.id); return s ? s.requisitos.map((x) => String(x).trim()).filter(Boolean) : []; };
function progreso(sol) {
  let t = 0, h = 0; const ch = sol.checks || {};
  baseDe(sol).forEach((_, i) => { t++; if ((ch._base || [])[i]) h++; });
  sol.sistemas.forEach((si) => propiosDe(si).forEach((_, i) => { t++; if ((ch[si.id] || [])[i]) h++; }));
  return { t, h, ok: h === t };
}
function vChecklist(sol) {
  const p = progreso(sol), pct = p.t ? Math.round((p.h / p.t) * 100) : 100, ch = sol.checks || {};
  const grupo = (clave, titulo, items) => items.length ? `<div class="chkgrp"><b>${esc(titulo)}</b>${items.map((t, i) => `<label class="chk"><input type="checkbox" data-chk="${esc(sol.id)}|${esc(clave)}|${i}" ${(ch[clave] || [])[i] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>` : "";
  const pie = p.ok
    ? `<div class="note ok">${glifo("check")}<div><b>Requisitos completos.</b> ${sol.listo ? `Ya avisaste el ${esc(fmtFecha(sol.listoFecha || hoyISO()))}: todo está listo para usar el sistema.` : "Avisa para que se pueda implementar el sistema en tu ocasión."}${sol.listo ? "" : `<div style="margin-top:10px"><button class="btn sm" data-act="chk-avisar" data-id="${esc(sol.id)}">Avisar que ya cumplo</button></div>`}</div></div>`
    : `<div class="note warn">${glifo("warn")}<div>Faltan ${p.t - p.h} ${plural(p.t - p.h, "requisito", "requisitos")} por cumplir antes de implementar el sistema.</div></div>`;
  return `<div class="chkl"><div class="chkl-h"><b>Lista de verificación de requisitos</b><span class="badge ${p.ok ? "ok" : "warn"}">${p.h}/${p.t}</span></div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    ${grupo("_base", "Generales", baseDe(sol))}${sol.sistemas.map((si) => grupo(si.id, si.nombre, propiosDe(si))).join("")}${p.t === 0 ? '<p class="muted" style="font-size:14px">Estos sistemas no tienen requisitos registrados.</p>' : ""}${pie}</div>`;
}
function avisoListo(sol) {
  const L = ["REQUISITOS COMPLETOS", `Folio: ${sol.folio}`, `Fecha: ${fmtFecha(hoyISO())}`, "", `Dependencia: ${sol.datos.dependencia}`, `Contacto: ${sol.datos.nombre} (${sol.datos.correo}, ${sol.datos.telefono})`, `Sistemas: ${sol.sistemas.map((s) => s.nombre).join(", ")}`, "", "REQUISITOS VERIFICADOS"];
  baseDe(sol).forEach((r) => L.push("[x] " + r));
  sol.sistemas.forEach((si) => propiosDe(si).forEach((r) => L.push(`[x] ${si.nombre}: ${r}`)));
  L.push("", "Todo está listo para implementar el sistema.");
  return L.join("\n");
}
function marcarRequisito(t) {
  const [sid, clave, i] = t.dataset.chk.split("|"), sol = S.sols.find((x) => x.id === sid); if (!sol) return;
  sol.checks = sol.checks || {}; const a = (sol.checks[clave] = sol.checks[clave] || []); a[+i] = t.checked;

}

const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
function setPath(o, p, val) { const k = p.split("."); let a = o; for (let i = 0; i < k.length - 1; i++) { a = a[k[i]]; if (a == null) return; } a[k[k.length - 1]] = val; }

async function hashPin(p) {
  const t = "catalogo|" + p;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return "h1:" + [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join(""); } } catch (e) {}
  let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return "h0:" + (h >>> 0).toString(16);
}

}
function pasosSigue(c) {
  c = c || cfg();
  const auto = !!(c.endpoint || "").trim(), dest = (c.correoDestino || "").trim();
  return [
    ["Envías el formulario", "Se genera un folio con el formato SOL-AAAAMMDD-XXXX y la solicitud queda guardada en «Mis solicitudes» de este dispositivo."],
    auto ? ["Llega al área responsable", "Tu solicitud se envía automáticamente; no tienes que hacer nada más."]
         : ["Llega al área responsable", dest ? `Se envía automáticamente a ${dest}. Si no se pudiera, se abre tu aplicación de correo con el mensaje ya redactado: solo presiona «Enviar».` : "Se envía automáticamente al área responsable. Si no se pudiera, se abre tu aplicación de correo con el mensaje ya redactado."],
    ["Revisamos tu solicitud", `Validamos disponibilidad y requisitos. Te respondemos en ${(c.tiempoRespuesta || "").trim() || "unos días hábiles"} al correo que registraste.`],
    ["Siguiente paso", (c.reunion || "").trim() || "Coordinamos una reunión con tu dependencia para definir accesos y fechas de uso."]
  ];
}

/* ---------- Carga de imágenes y archivos ---------- */
const leer = (f) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(f); });
async function imagen(file, max, mime) {
  if (/svg|gif/.test(file.type)) return leer(file);
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    const x = c.getContext("2d"); if (mime === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL(mime, 0.86);
  } finally { URL.revokeObjectURL(url); }
}
const draftActual = () => { const [a, b, c] = hashParts(); return a === "admin" && b === "editar" ? S.drafts[c] : null; };

async function subirArchivos(kind, files) {
  const dr = draftActual();
  if (!dr && kind !== "logo") return;
  for (const f of files) {
    try {
      if (kind === "icono") { if (!/^image\//.test(f.type)) { toast("El icono debe ser una imagen."); continue; } dr.s.icono.imagen = await imagen(f, 512, "image/png"); }
      else if (kind === "portada") { if (!/^image\//.test(f.type)) { toast("La portada debe ser una imagen."); continue; } dr.s.portada = await imagen(f, 1600, "image/jpeg"); }
      else if (kind === "captura") { if (!/^image\//.test(f.type)) { toast(`«${f.name}» no es una imagen.`); continue; } dr.s.capturas.push({ src: await imagen(f, 1600, "image/jpeg"), pie: "" }); }
      else if (kind === "archivo") {
        if (f.size > LIMITE_ARCHIVO) { toast(`«${f.name}» pesa más de ${bytes(LIMITE_ARCHIVO)}.`); continue; }
        dr.s.archivos.push({ id: uid("arc"), nombre: f.name, tipo: f.type || "", tamano: f.size, categoria: /\.pdf$/i.test(f.name) ? "Manual" : "Otro", descripcion: "", data: await leer(f) });
      }
      else if (kind === "logo") { if (!/^image\//.test(f.type)) { toast("El logotipo debe ser una imagen."); continue; } S.cfgDraft.logo = await imagen(f, 256, "image/png"); }
      if (dr) dr.dirty = true;
    } catch (e) { toast(`No se pudo leer «${f.name}».`); }
  }
  keep(() => render(false));
}

      titulo: "Cómo publicar tus cambios", wide: true,
      body: `<p class="muted">Los cambios que haces aquí se guardan solo en este navegador. Para que todas las dependencias los vean:</p>
        <ol class="timeline"><li><span class="n">1</span><div><b>Descarga el catálogo</b><span>Usa «Descargar catálogo». Se genera el archivo <b>${ARCHIVO_PUBLICADO}</b> con todos tus sistemas, textos e imágenes.</span></div></li>
        <li><span class="n">2</span><div><b>Súbelo junto a index.html</b><span>Colócalo en la misma carpeta de tu sitio y reemplaza el anterior.</span></div></li>
        <li><span class="n">3</span><div><b>Listo</b><span>Quien abra la página verá el catálogo actualizado. Si no ve el cambio, que recargue la página.</span></div></li></ol>
        <div class="note info">${glifo("info")}<div>Si abres <b>index.html</b> directamente desde tu computadora (sin servidor), el navegador no carga ${ARCHIVO_PUBLICADO}. Súbelo a un servidor o hosting para compartirlo.</div></div>`,
      pie: `<button class="btn sec" data-act="exportar">${glifo("download")}Descargar catálogo</button><button class="btn" data-act="cerrar-modal">Entendido</button>`
    });
  },
  async "descartar-local"() {
    if (!(await confirmar({ titulo: "Descartar mis cambios", texto: "Se borrarán los cambios hechos en este navegador y se usará el catálogo publicado.", si: "Descartar", peligro: true }))) return;
    await IDB.del("catalogo"); S.cat = migrar(S.pub); S.cat.editado = false; S.drafts = {}; S.cfgDraft = null; revalidarSesion(); toast("Usando el catálogo publicado"); render(false);
  },

  /* editor */
  "e-add"(t) { const dr = draftActual(); if (!dr) return; dr.s[t.dataset.path].push(PLANTILLAS[t.dataset.path]()); dr.dirty = true; keep(() => render(false)); const l = $$(`[data-path^="${t.dataset.path}."]`).pop(); if (l) l.focus({ preventScroll: false }); },
  "e-del"(t) { const dr = draftActual(); if (!dr) return; dr.s[t.dataset.path].splice(+t.dataset.i, 1); dr.dirty = true; keep(() => render(false)); },
  "e-mover"(t) { const dr = draftActual(); if (!dr) return; mover(dr.s[t.dataset.path], +t.dataset.i, +t.dataset.d); dr.dirty = true; keep(() => render(false)); },
  "e-glifo"(t) { const dr = draftActual(); if (!dr) return; dr.s.icono.glifo = t.dataset.g; dr.s.icono.imagen = ""; dr.dirty = true; keep(() => render(false)); },
  "e-color"(t) { const dr = draftActual(); if (!dr) return; dr.s.icono.color = t.dataset.c; dr.dirty = true; keep(() => render(false)); },
  "e-quitar-icono"() { const dr = draftActual(); if (!dr) return; dr.s.icono.imagen = ""; dr.dirty = true; keep(() => render(false)); },
  "e-quitar-portada"() { const dr = draftActual(); if (!dr) return; dr.s.portada = ""; dr.dirty = true; keep(() => render(false)); },
  "e-cat"(t) { const dr = draftActual(); if (!dr) return; const a = dr.s.categorias, i = a.indexOf(t.dataset.id); if (i >= 0) a.splice(i, 1); else a.push(t.dataset.id); dr.dirty = true; keep(() => render(false)); },
  "tag-add"(t) { agregarTag(t.dataset.t); },
  "tag-del"(t) { const dr = draftActual(); if (!dr) return; dr.s.usos = dr.s.usos.filter((u) => u !== t.dataset.t); dr.dirty = true; keep(() => render(false)); },
  "e-ver-archivo"(t) { const dr = draftActual(); if (dr) abrirArchivo(dr.s.archivos[+t.dataset.i]); },
  "e-guardar": guardarDraft,
  async "e-cancelar"() {
    const [, , id] = hashParts(), dr = S.drafts[id];
    if (dr && dr.dirty && !(await confirmar({ titulo: "Descartar cambios", texto: "Hay cambios sin guardar. Si sales ahora, se perderán.", si: "Descartar", peligro: true }))) return;
    delete S.drafts[id]; go("admin");
  },
  "e-descartar"() { const [, , id] = hashParts(); delete S.drafts[id]; render(false); },
  "entrar-visitante"() { S.guest = true; try { sessionStorage.setItem("catalogo-visitante", "1"); } catch (e) {} location.hash = "#/"; render(true); },
  "ir-login"() { cerrarModal(); S.guest = false; try { sessionStorage.removeItem("catalogo-visitante"); } catch (e) {} S.authView = "login"; render(false); },
  "super-reenviar"() { reenviarCodigoSuper(); },
  "super-cancelar"() { pendSuper.guardar(null); S.authView = S.cat.usuarios.length ? "login" : "super"; render(false); },
  "ren-sis"(t) { abrirRenombrarSistema(t.dataset.id); },
  "edit-cat"(t) { abrirCategoria(t.dataset.id); },
  async "chk-avisar"(t) {
    const sol = S.sols.find((x) => x.id === t.dataset.id); if (!sol) return;
    if (!progreso(sol).ok) return toast("Aún faltan requisitos por marcar.");
    const c = cfg(), para = (c.correoDestino || c.correoAdmin || CORREO_SUPER).trim(), asunto = `Requisitos completos · ${sol.sistemas.map((s) => s.nombre).join(", ")} · ${sol.datos.dependencia} (${sol.folio})`, cuerpo = avisoListo(sol);
    t.disabled = true; t.textContent = "Enviando…";
    const ok = await enviarAvisoCorreo(para, asunto, { Folio: sol.folio, Dependencia: sol.datos.dependencia, Contacto: sol.datos.nombre, Correo: sol.datos.correo, Teléfono: sol.datos.telefono, Sistemas: sol.sistemas.map((s) => s.nombre).join(", "), Estado: "Requisitos completos: listo para implementar", Detalle: cuerpo });
    sol.listo = true; sol.listoFecha = hoyISO(); await guardarSolicitudes();
    if (ok) toast("Aviso enviado. ¡Todo listo para usar el sistema!");
    else { toast("No se pudo enviar automáticamente. Se abrirá tu correo."); setTimeout(() => { location.href = `mailto:${para}?subject=${enc(asunto)}&body=${enc(cuerpo)}`; }, 300); }
    keep(() => render(false));
  },
  "qa-activar"() { activarQA(); },
  "qa-salir"() { salirQA(); },
  "qa-datos"() { cargarDatosPrueba(); },
  "qa-reiniciar"() { restaurarQA(true); toast("Datos de prueba reiniciados"); render(false); },
  "qa-correr"() { correrQA(); },
  "qa-limpiar-manual"() { try { localStorage.removeItem("catalogo-qa-manual"); } catch (e) {} keep(() => render(false)); },
  "cerrar-modal": cerrarModal,
  "conf-si"() { if (confFin) confFin(true); },
  "conf-no"() { if (confFin) confFin(false); }
};

const SOLO_SUPER = new Set(["usr-nuevo", "usr-reset", "usr-reset-ok", "usr-toggle", "usr-del", "guardar-cfg", "exportar", "descartar-local", "quitar-ejemplos", "probar-correo", "cfg-tema", "cfg-acento", "quitar-logo", "como-publicar", "qa-activar", "qa-salir", "qa-datos", "qa-reiniciar", "qa-correr", "qa-limpiar-manual"]);
const QA_BLOQ = new Set(["exportar", "como-publicar", "descartar-local"]);
const SOLO_GESTION = new Set(["toggle-pub", "mover", "duplicar", "del-sistema", "add-cat", "del-cat", "edit-cat", "ren-sis", "img-quitar", "e-guardar", "e-add", "e-del"]);
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  if (SOLO_SUPER.has(t.dataset.act) && !S.super) { e.preventDefault(); toast("Esta acción es solo para el superadministrador."); return; }
  if (S.qa && QA_BLOQ.has(t.dataset.act)) { e.preventDefault(); toast("No disponible en modo pruebas: saca los datos reales saliendo primero."); return; }
  if (SOLO_GESTION.has(t.dataset.act) && !S.admin) { e.preventDefault(); toast("Necesitas ser colaborador o superadministrador."); return; }
  const fn = ACT[t.dataset.act];
  if (fn) { if (t.tagName === "A" && !t.getAttribute("href")) e.preventDefault(); fn(t, e); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.path) {
    const dr = draftActual(); if (!dr) return;
    setPath(dr.s, t.dataset.path, t.type === "checkbox" ? t.checked : t.value); dr.dirty = true;
    const sb = $(".savebar .muted"); if (sb) sb.textContent = "Tienes cambios sin guardar.";
    return;
  }
  if (t.dataset.form) {
    F.vals[t.dataset.form] = t.type === "checkbox" ? t.checked : t.value;
    if (F.errs[t.dataset.form]) { delete F.errs[t.dataset.form]; const fl = t.closest(".field"); if (fl) { fl.classList.remove("bad"); const er = $(".err", fl); if (er) er.remove(); } const er2 = $("#err-acepto"); if (t.dataset.form === "acepto" && er2) er2.remove(); }
    return;
  }
  if (t.dataset.cfg && S.cfgDraft) { S.cfgDraft[t.dataset.cfg] = t.value; return; }
  if (t.id === "qs" || t.id === "qv") {
    S.q = t.value;
    const o = t.id === "qs" ? $("#qv") : $("#qs"); if (o && o.value !== S.q) o.value = S.q;
    if (hashParts()[0] !== "buscar") go("buscar"); else pintarBusqueda();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.qa) marcarQA(t);
  else if (t.dataset.usrRol) cambiarRolUsuario(t);
  else if (t.dataset.chk) marcarRequisito(t);
  else if (t.dataset.sel === "orden") { F2.orden = t.value; render(false); }
  else if (t.dataset.sel === "addsis") { if (t.value && !F.sel.includes(t.value)) F.sel.push(t.value); keep(() => render(false)); }
  else if (t.dataset.up2 && S.admin) { const f = t.files[0], k = t.dataset.up2, id = t.dataset.id; t.value = ""; if (f) subirImagenRapida(k, id, f); }
  else if (t.dataset.up === "import") { if (!S.super) { t.value = ""; return toast("Solo el superadministrador puede cargar un catálogo."); } const f = t.files[0]; t.value = ""; if (f) importarCatalogo(f); }
  else if (t.dataset.up) { const fs = [...t.files]; t.value = ""; subirArchivos(t.dataset.up, fs); }
  else if (t.dataset.catf && S.admin) {
    const k = catById(t.dataset.id); if (!k) return;
    if (t.dataset.catf === "nombre") { k.nombre = t.value.trim() || k.nombre; guardarCatalogo(); renderChrome("admin"); }
    else { k[t.dataset.catf] = t.value; guardarCatalogo(); keep(() => render(false)); }
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target;
  if (f.id === "form-sol") { e.preventDefault(); enviarSolicitud(); }
  else if (f.id === "form-login") { e.preventDefault(); iniciarSesion(); }
  else if (f.id === "form-super") { e.preventDefault(); solicitarSuper(); }
  else if (f.id === "form-codigo") { e.preventDefault(); verificarCodigoSuper(); }
  else if (f.id === "form-ren") { e.preventDefault(); guardarRenombrar(); }
  else if (f.id === "form-cat") { e.preventDefault(); guardarCategoria(); }
  else if (f.id === "form-cambiar") { e.preventDefault(); guardarClaveObligatoria(); }
  else if (f.id === "form-reg") { e.preventDefault(); solicitarUsuario(); }
  else if (f.id === "form-rec") { e.preventDefault(); solicitarRecuperacion(); }
  else if (f.id === "form-usr") { e.preventDefault(); crearUsuarioAdmin(); }
  else if (f.id === "form-pass") { e.preventDefault(); cambiarMiClave(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#lb")) cerrarLightbox(); else if ($("#modal")) { if (confFin) confFin(false); else cerrarModal(); } }
  else if ($("#lb") && lb) { if (e.key === "ArrowLeft") ACT["lb-prev"](); else if (e.key === "ArrowRight") ACT["lb-next"](); }
  else if (e.key === "Enter" && e.target.id === "tag-in") { e.preventDefault(); agregarTag(); }
});
["dragover", "dragleave", "drop"].forEach((ev) => document.addEventListener(ev, (e) => {
  const z = e.target.closest && e.target.closest(".dz"); if (!z) return;
  e.preventDefault();
  if (ev === "dragover") z.classList.add("drag"); else z.classList.remove("drag");
  if (ev === "drop" && e.dataTransfer) subirArchivos(z.dataset.drop, [...e.dataTransfer.files]);
}));
window.addEventListener("scroll", () => { const nb = $("#nb"); if (nb) nb.classList.toggle("scrolled", window.scrollY > 8); }, { passive: true });

/* ---------- Arranque ---------- */
async function boot() {
  const okIDB = await IDB.open();
  S.memoria = !okIDB;
  const local = await IDB.get("catalogo"), sols = await IDB.get("solicitudes");
  S.sols = Array.isArray(sols) ? sols : [];
  let pub = null;
  if (location.protocol !== "file:") {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 3500);
      const r = await fetch(ARCHIVO_PUBLICADO, { cache: "no-store", signal: ctl.signal }); clearTimeout(tm);
      if (r.ok) { const j = await r.json(); if (catValido(j)) pub = j; }
    } catch (e) { /* sin catálogo publicado */ }
  }
  S.pub = pub;
  if (local && local.editado && catValido(local)) S.cat = migrar(local);
  else if (pub) { S.cat = migrar(pub); S.cat.editado = false; }
  else S.cat = migrar(datosEjemplo());
  restaurarSesion();
  window.addEventListener("hashchange", () => render(true));
  render(true);
}
boot().catch((err) => { console.error(err); view.innerHTML = vacio("No se pudo iniciar el catálogo", "Recarga la página. Si el problema continúa, avisa al equipo responsable."); });
})();
</script>
</body>
</html>
